<!doctype html>
<!-- The camera page: any phone or laptop browser becomes a labelled live Meanwhile camera that uploads what changes. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meanwhile camera</title>
  <style>
    :root { color-scheme: dark; --bg: #0d0f12; --fg: #f2f4f7; --muted: #9aa3ae; --live: #3ecf7a; --warn: #f5b041; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(13, 15, 18, .82); }
    .label { font-weight: 700; font-size: 20px; }
    .status { flex: 1; color: var(--muted); font-size: 15px; }
    .status.live::before { content: "● "; color: var(--live); }
    .status.warn::before { content: "● "; color: var(--warn); }
    button { font: inherit; color: var(--fg); background: #232830; border: 1px solid #39404a;
      border-radius: 10px; padding: 8px 14px; }
    form { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; padding: 16px; text-align: center; }
    form h1 { margin: 0; font-size: 26px; }
    form p { margin: 0; color: var(--muted); max-width: 26em; }
    input { font: inherit; font-size: 22px; padding: 10px 14px; border-radius: 10px; border: 1px solid #39404a;
      background: #161a1f; color: var(--fg); text-align: center; }
    #focus { position: fixed; border: 3px solid var(--warn); border-radius: 6px; pointer-events: none; }
    #focus.held { border-style: dashed; border-color: #f2f4f7; }
    #live { position: fixed; border: 3px solid var(--live); border-radius: 4px; pointer-events: none; }
    #live.guess { border-style: dashed; }
    #live.held { border-color: #f2f4f7; }
    #live.missing { border-style: dotted; border-color: #e5484d; opacity: .7; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <form id="setup" hidden>
    <h1>Make this a camera</h1>
    <p>Name it after where it points, like Desk, Room or Door.</p>
    <input id="label-input" maxlength="24" placeholder="Room" autocomplete="off" required>
    <button type="submit">Start camera</button>
    <p id="setup-error"></p>
  </form>
  <video id="video" autoplay playsinline muted hidden></video>
  <div id="focus" hidden></div>
  <div id="live" hidden></div>
  <div class="bar" id="bar" hidden>
    <span class="label" id="label"></span>
    <span class="status" id="status">Starting…</span>
    <button id="flip" type="button">Flip</button>
    <button id="rename" type="button">Rename</button>
  </div>
  <script src="js/camera.js"></script>
</body>
</html>
